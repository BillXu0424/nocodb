# NocoDB + Datus Agent 联合部署
# 共享 nc_data 卷，使 Datus 能访问 NocoDB 的 SQLite 文件，正确创建 namespace
# 运行前请设置 .env 中的 DATUS_SOURCE_PATH（datus-agent 源码目录）

services:
  nocodb:
    # 二开版本：在本地（有外网）构建后导出，在开发机 load
    # 本地执行：./build-local-docker-image.sh
    #         docker save -o nocodb-local.tar nocodb-local
    # 开发机：sudo docker load -i nocodb-local.tar
    image: nocodb-local:latest
    ports:
      - "8080:8080"
    restart: always
    environment:
      NC_DB: "sqlite3://?d=noco.db"
      NC_MINIMAL_DBS: "true"
      NC_TOOL_DIR: "/usr/app/data/"
      # 同 compose 网络，用服务名访问 Datus
      NC_DATUS_AGENT_URL: "http://datus-backend:8002"
      NC_DATUS_CLIENT_ID: "${NC_DATUS_CLIENT_ID:-datus_client}"
      NC_DATUS_CLIENT_SECRET: "${NC_DATUS_CLIENT_SECRET:-datus_secret_key}"
    volumes:
      - nc_data:/usr/app/data
    networks:
      - nocodb_datus

  datus-backend:
    build:
      context: ${DATUS_SOURCE_PATH}
      dockerfile: docker/backend/Dockerfile
    container_name: datus-backend
    ports:
      - "8002:8002"
      - "7681:7681"
    volumes:
      # 使用主机目录。sudo 时 $HOME 会变成 /root，需在 .env 中设置 DATUS_HOME 为实际用户 home
      - ${DATUS_HOME:-$HOME}/.datus/conf:/root/.datus/conf
      - ${DATUS_HOME:-$HOME}/.datus/data:/root/.datus/data
      - ${DATUS_HOME:-$HOME}/.datus/logs:/root/.datus/logs
      - ${DATUS_HOME:-$HOME}/.cache/huggingface:/root/.cache/huggingface
      # 共享 NocoDB 的 SQLite 目录，使 Datus 能读取 nc_minimal_dbs/*.db
      - nc_data:/usr/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # LLM API Key（agent.yml 中引用），按实际使用配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - nocodb_datus
    restart: always

networks:
  nocodb_datus:
    driver: bridge

volumes:
  nc_data: {}          # 共享：NocoDB 数据 + SQLite 文件，Datus 只读挂载（Docker 管理）
